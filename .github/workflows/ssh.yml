name: Remote SSH Session

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: 'Session timeout in minutes (1–360)'
        required: true
        default: '60'
        type: string

jobs:
  ssh-runner:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SSH Session
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: ${{ inputs.timeout }}
